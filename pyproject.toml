[project]
name = "dockiln"
version = "0.1.0"
description = "Python document conversion, Unicode PDF generation, structured extraction, and DOCX editing"
readme = "README.md"
license = "MIT AND OFL-1.1"
license-files = ["LICENSE", "src/dockiln/writers/pdf/fonts/OFL.txt", "src/dockiln/writers/docx/resources/python-docx-LICENSE.txt"]
authors = [
    {name = "shenyankm"}
]
keywords = [
    "word", "docx", "doc", "rtf", "pdf",
    "office", "openxml", "document", "convert",
]
requires-python = ">=3.10,<3.15"
dependencies = [
    "olefile>=0.46",
    "fpdf2>=2.8.9",
    "pydantic>=2.0.0",
    "defusedxml>=0.7.1",
    "Pillow>=10.0.0"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/shenyankm/DocKiln"
Repository = "https://github.com/shenyankm/DocKiln"
Issues = "https://github.com/shenyankm/DocKiln/issues"

[project.scripts]
dockiln = "dockiln.convert:main"

[project.optional-dependencies]
shaping = ["uharfbuzz>=0.39.0"]
dev = [
    "pytest>=9.0.2",
    "pypdf>=5.0.0",
    "PyMuPDF>=1.24.0",
    "python-docx>=1.2.0",
    "docx2python>=3.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# PyMuPDF's SWIG-generated types lack __module__; unrelated to conversion behavior.
filterwarnings = [
    "ignore:^builtin type SwigPyPacked has no __module__ attribute$:DeprecationWarning",
    "ignore:^builtin type SwigPyObject has no __module__ attribute$:DeprecationWarning",
    "ignore:^builtin type swigvarlink has no __module__ attribute$:DeprecationWarning",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313", "py314"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dockiln"]
